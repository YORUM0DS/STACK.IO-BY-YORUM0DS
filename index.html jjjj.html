<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift Arcade</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0e2528"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f1e6c9;--mute:rgba(255,255,255,.62);--ac:#ff8a65;--sh:rgba(0,0,0,.55);--bb:rgba(255,255,255,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{height:100vh;height:100dvh;display:flex;justify-content:center;background:#0e2528;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:relative;width:min(100%,calc(100vh*360/560));width:min(100%,calc(100dvh*360/560));aspect-ratio:360/560;max-height:100%;align-self:center}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;display:none;align-items:flex-start;justify-content:space-between;padding:12px 14px;pointer-events:none}
#hud button{pointer-events:auto;padding:6px 12px;min-width:70px}
#sc{font-size:52px;font-weight:800;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.3)}
#bs{font-size:14px;font-weight:600;color:var(--mute);min-width:70px;text-align:right;padding-top:8px}
.sheet{position:absolute;inset:0;display:none;flex-direction:column;gap:12px;padding:20px;box-sizing:border-box;overflow:auto;background:var(--sh);backdrop-filter:blur(8px)}
.mid{justify-content:center;text-align:center}
h1{margin:6px 0 0;font-size:38px;font-weight:800}
h2{margin:8px 0 2px;font-size:20px}
p{margin:0;color:var(--mute);line-height:1.35}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--bb);border:1.5px solid var(--mute);border-radius:12px;padding:10px 14px}
button:disabled{opacity:.4}
button.p{background:var(--ac);color:#111;border-color:var(--ac)}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px;min-height:96px}
.card b{font-size:18px}.card small{color:var(--mute);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.3)}
.row div{flex:1}.row small{display:block;color:var(--mute)}
.sw{width:44px;height:44px;border-radius:12px;flex:none}
input,textarea{font:inherit;color:var(--ink);background:var(--bb);border:1.5px solid var(--mute);border-radius:10px;padding:9px;width:100%;box-sizing:border-box}
.two{display:flex;gap:8px}
#msg{color:var(--ac);font-weight:700;min-height:20px}
#splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0e2528;color:#f1e6c9;font:800 40px "Bricolage Grotesque",system-ui,sans-serif;animation:sp .6s 1.1s forwards}
@keyframes sp{to{opacity:0;visibility:hidden}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{animation:in .25s}
div.card{cursor:pointer;border:1.5px solid var(--mute);border-radius:14px;background:var(--bb);position:relative}
.fav{position:absolute;top:4px;right:6px;background:none;border:0;padding:2px 6px;font-size:20px;color:var(--ac)}
.bar{height:8px;border-radius:6px;background:var(--bb);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s}
#lvt{font-weight:700}
</style></head>
<body><div id="splash">Drift Arcade</div><div id="stage"><canvas id="c"></canvas>
<div id="hud"><button id="back">Menu</button><div id="sc">0</div><div id="bs"></div></div>
<div id="home" class="sheet"><div class="two" style="justify-content:space-between;align-items:center"><h1>Drift Arcade</h1><button id="toSet">Settings</button></div>
<div><div id="lvt"></div><div class="bar"><i id="lvb"></i></div></div>
<div id="chips" class="two" style="flex-wrap:wrap"></div><div id="cards"></div>
<button id="vrb" class="p" style="display:none">Enter VR</button><button id="daily" class="p"></button><button id="toShop">Themes and save</button></div>
<div id="set" class="sheet"><div class="two" style="justify-content:space-between;align-items:center"><h1 style="font-size:28px">Settings</h1><button id="closeSet">Close</button></div>
<div id="setList"></div><h2>Your stats</h2><p id="stats"></p><button id="resetSet">Reset settings</button><button id="reset">Reset all progress</button><p>Drift Arcade 3.0</p></div>
<div id="over" class="sheet mid"><h1 id="ovT"></h1><p id="ovS" style="font-size:20px"></p><button class="p" id="again">Play again</button><button id="toHome">Menu</button></div>
<div id="shop" class="sheet"><div class="two" style="align-items:center;justify-content:space-between"><h1 style="font-size:28px">Themes</h1><button id="closeShop">Close</button></div><p id="cn"></p><div id="tl"></div>
<h2>Unlock code</h2><div class="two"><input id="code" placeholder="Enter code" autocapitalize="off"><button id="redeem">Unlock</button></div>
<h2>Save progress</h2><p>Your progress saves on this device by itself. Copy a backup code to move it to another device.</p><textarea id="bk" rows="3"></textarea><div class="two"><button id="exp">Show my code</button><button id="imp">Restore</button></div><p id="msg"></p></div>
</div>

init(){this.b=[{x:80,w:200}];this.cur={x:0,w:200,d:1};this.f=null;this.deb=[];this.cam=0;this.t=0;this.combo=0;this.col=0},

/* flow */
function open(id){['home','over','shop','set'].forEach(s=>$(s).style.display=s===id?'flex':'none');$('hud').style.display=id?'none':'flex'}
function settle(){const g=Math.round(score*G.rate)+bonus;S.coins+=g;S.xp+=Math.max(1,g);S.plays++;S.total+=score;const nb=score>(S.best[gid]||0);if(nb)S.best[gid]=score;save();return{g,nb}}
function start(id){G=games[id];gid=id;score=0;bonus=0;R.prog=0;$('sc').textContent=0;$('bs').textContent='Best '+(S.best[id]||0);G.init();state='play';open(null)}
function end(){
  if(state!=='play')return;state='over';overAt=performance.now();sfx(160,.35,'sawtooth');buzz(60);const r=settle();
  $('ovT').textContent=r.nb&&score>0?'New best!':'Game over';$('ovS').textContent=score+'  |  +'+r.g+' coins';
  setTimeout(()=>{if(state==='over')open('over')},650);
}
function home(){state='home';G=null;shake=0;R.prog=0;renderHome();open('home')}
let cat='All';
function renderHome(){
  const lvl=Math.floor(Math.sqrt(S.xp/25))+1,lo=(lvl-1)*(lvl-1)*25,hi=lvl*lvl*25;
  $('lvt').textContent='Level '+lvl+'   |   '+S.coins+' coins';$('lvb').style.width=Math.round((S.xp-lo)/(hi-lo)*100)+'%';
  const ch=$('chips');ch.innerHTML='';
  ['All','Favorites','Arcade','Puzzle','Reflex'].forEach(n=>{const x=document.createElement('button');x.textContent=n;x.style.padding='6px 12px';if(n===cat)x.className='p';x.onclick=()=>{cat=n;renderHome()};ch.appendChild(x)});
  const c=$('cards');c.innerHTML='';
  const list=GAMES.filter(g=>cat==='All'||(cat==='Favorites'?S.fav.includes(g.id):g.c===cat));
  if(!list.length){const e=document.createElement('p');e.style.gridColumn='1/3';e.textContent='Tap the star on a game to add it here.';c.appendChild(e)}
  list.forEach(g=>{
    const d=document.createElement('div');d.className='card';
    const ic=document.createElement('span'),nm=document.createElement('b'),ds=document.createElement('small'),bs=document.createElement('small'),st=document.createElement('button');
    ic.textContent=g.i;ic.style.fontSize='26px';nm.textContent=g.n;ds.textContent=g.d;bs.textContent='Best '+(S.best[g.id]||0);

    st.onclick=e=>{e.stopPropagation();const k=S.fav.indexOf(g.id);if(k<0)S.fav.push(g.id);else S.fav.splice(k,1);save();renderHome()};
    d.append(ic,nm,ds,bs,st);d.onclick=()=>start(g.id);c.appendChild(d);
  });

}
$('daily').onclick=()=>{const i=dailyInfo();if(!i)return;S.coins+=i.amt;S.daily={d:today(),s:i.s};save();sfx(880,.2);renderHome()};
function renderSet(){
  const L=$('setList');L.innerHTML='';
  const own=k=>k==='snd'||k==='vib',gv=k=>own(k)?S[k]:S.cfg[k],put=(k,v)=>{if(own(k))S[k]=v;else S.cfg[k]=v;save()};
  SET.forEach(it=>{
    if(it.length===1){const h=document.createElement('h2');h.textContent=it[0];L.appendChild(h);
      if(it[0]==='VR mode'){const p=document.createElement('p');p.textContent=VR.ok?'VR is ready. Use Enter VR on the home screen.':'VR needs a headset browser such as Meta Quest Browser.';L.appendChild(p)}return}
    const k=it[0],t=it[2],row=document.createElement('div'),lb=document.createElement('div');row.className='row';lb.textContent=it[1];row.appendChild(lb);
    if(t==='t'){const x=document.createElement('button');x.textContent=gv(k)?'On':'Off';x.onclick=()=>{put(k,!gv(k));renderSet()};row.appendChild(x)}
    else if(t==='r'){const x=document.createElement('input'),o=document.createElement('small');x.type='range';x.min=it[3];x.max=it[4];x.step=it[5];x.value=gv(k);x.style.width='110px';o.textContent=Math.round(gv(k)*10)/10;
      x.oninput=()=>{put(k,+x.value);o.textContent=Math.round(+x.value*10)/10};row.append(x,o)}

      it[3].forEach(op=>{const x=document.createElement('button');x.textContent=op[0];x.style.padding='6px 10px';if(gv(k)===op[1])x.className='p';x.onclick=()=>{put(k,op[1]);renderSet()};w.appendChild(x)});row.appendChild(w)}
    L.appendChild(row)});

}
$('toSet').onclick=()=>{renderSet();open('set')};$('closeSet').onclick=()=>home();

$('toShop').onclick=()=>{msg('');renderShop();open('shop')};

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
$('redeem').onclick=async()=>{
  const c=$('code').value.toUpperCase().replace(/[\s-]/g,'');let h='';try{h=await sha('drift:'+c)}catch(e){}
  if(c&&HASHES.includes(h)){S.pro=true;save();renderShop();msg('Unlocked all themes. Thank you!')}else msg('That code does not match.');
};
$('exp').onclick=()=>{$('bk').value=btoa(JSON.stringify(S));msg('Copy this code and keep it safe.')};
$('imp').onclick=()=>{
  try{const o=JSON.parse(atob($('bk').value.trim()));
    if(typeof o.coins!=='number'||!Array.isArray(o.owned)||!o.best||typeof o.best!=='object')throw 0;
    S=Object.assign({fav:[],xp:0,plays:0,total:0,snd:true,vib:true,daily:{d:'',s:0}},o,{theme:o.theme||'tide',pro:!!o.pro});S.cfg=Object.assign({},CFGD,S.cfg);save();applyTheme();renderShop();msg('Progress restored.');
  }catch(e){msg('That code is not valid.')}
};
/* input and loop */
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();const p=pt(e);G.tap(p[0],p[1])});
cv.addEventListener('pointermove',e=>{if(state==='play'&&G.move)G.move(pt(e)[0])});
addEventListener('keydown',e=>{if(e.code==='Space'&&state==='play'){e.preventDefault();G.tap(W/2,H/2)}});
function size(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect(),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
let fpsV=60;
function tick(dt){
  R.pulse=Math.max(0,R.pulse-dt*1.8);R.hue+=dt*(5+R.pulse*50);if(S.cfg.calm)R.pulse=0;
  if(G&&state==='play')G.update(dt*S.cfg.spd);
  const s=cv.width/W;ctx.setTransform(s,0,0,s,0,0);ctx.save();
  if(shake>.3&&!S.cfg.calm){const m=S.cfg.shk;ctx.translate((Math.random()-.5)*shake*m,(Math.random()-.5)*shake*m);shake*=.88}else shake=0;
  drawBg();if(G)G.draw();ctx.restore();
  if(S.cfg.showFps){fpsV+=(1/Math.max(dt,.001)-fpsV)*.1;txt(Math.round(fpsV)+' fps',34,H-8,12)}
}
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);
  if(S.cfg.fps&&t-last<1000/S.cfg.fps-4){requestAnimationFrame(frame);return}
  last=t;
  if(!VR.on){size();tick(dt);if(t-lastBg>120){lastBg=t;const q=bgStops();document.body.style.background='linear-gradient('+q[0]+','+q[1]+')'}}
  requestAnimationFrame(frame);
}
/* VR mode: WebXR. The game is drawn on a big floating screen; controllers aim, trigger taps, thumbstick and hand swings move you. */
const VR={on:false,ok:false,floor:false,g:new Map(),py:new Map(),cool:0,last:0};
const VS='attribute vec3 p;attribute vec2 u;uniform mat4 P,V,M;varying vec2 v;void main(){v=u;gl_Position=P*V*M*vec4(p,1.);}';
const FS='precision mediump float;varying vec2 v;uniform sampler2D t;void main(){gl_FragColor=texture2D(t,v);}';
const PAN=()=>{const w=1.2*S.cfg.vrSize;return{w,h:w*H/W,x:0,y:(VR.floor?1.5:0)+S.cfg.vrH,z:-S.cfg.vrDist}};
function vrPulse(a,ms){if(!VR.on||!S.cfg.vrHap||!VR.s)return;for(const x of VR.s.inputSources){const h=x.gamepad&&x.gamepad.hapticActuators&&x.gamepad.hapticActuators[0];if(h&&h.pulse)h.pulse(a,ms)}}
function initGL(){
  const gl=VR.gl,mk=(t,c)=>{const q=gl.createShader(t);gl.shaderSource(q,c);gl.compileShader(q);return q},p=gl.createProgram();
  gl.attachShader(p,mk(gl.VERTEX_SHADER,VS));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);VR.prog=p;
  VR.loc={p:gl.getAttribLocation(p,'p'),u:gl.getAttribLocation(p,'u'),P:gl.getUniformLocation(p,'P'),V:gl.getUniformLocation(p,'V'),M:gl.getUniformLocation(p,'M')};
  VR.buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,VR.buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.5,-.5,0,0,0,.5,-.5,0,1,0,-.5,.5,0,0,1,.5,.5,0,1,1]),gl.STATIC_DRAW);
  VR.tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,VR.tex);
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(a=>gl.texParameteri(gl.TEXTURE_2D,a[0],a[1]));
}
async function enterVR(){
  if(!VR.ok)return;const btn=$('vrb');
  try{
    const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
    const gl=document.createElement('canvas').getContext('webgl',{xrCompatible:true,antialias:true});
    if(gl.makeXRCompatible)await gl.makeXRCompatible();
    s.updateRenderState({baseLayer:new XRWebGLLayer(s,gl)});
    try{VR.ref=await s.requestReferenceSpace('local-floor');VR.floor=true}catch(e){VR.ref=await s.requestReferenceSpace('local');VR.floor=false}
    VR.s=s;VR.gl=gl;initGL();VR.g.clear();VR.py.clear();VR.last=0;VR.on=true;cv.width=720;cv.height=1120;
    s.addEventListener('end',()=>{VR.on=false;VR.s=null});
    s.addEventListener('selectstart',e=>vrSelect(e.inputSource));
    s.addEventListener('squeezestart',()=>s.end());
    const hz=S.cfg.vrHz;if(hz&&s.supportedFrameRates&&Array.from(s.supportedFrameRates).includes(hz))s.updateTargetFrameRate(hz).catch(()=>{});
    s.requestAnimationFrame(onXR);
  }catch(e){btn.textContent='VR could not start';setTimeout(()=>{btn.textContent='Enter VR'},2500)}
}
function vrInput(frame,dt){
  const P=PAN();VR.cool-=dt;VR.g.clear();
  for(const src of VR.s.inputSources){
    const hd=S.cfg.hand;if(hd!=='Both'&&src.handedness!==hd)continue;if(!src.targetRaySpace)continue;
    const pose=frame.getPose(src.targetRaySpace,VR.ref);if(!pose)continue;
    const m=pose.transform.matrix,dz=-m[10];
    if(dz<-1e-3){const t=(P.z-m[14])/dz,hx=m[12]-m[8]*t,hy=m[13]-m[9]*t,gx=((hx-P.x)/P.w+.5)*W,gy=(.5-(hy-P.y)/P.h)*H;
      if(gx>=0&&gx<=W&&gy>=0&&gy<=H){VR.g.set(src,[gx,gy]);if(state==='play'&&G&&G.move)G.move(gx)}}
    const gp=src.gamepad;
    if(state==='play'&&G&&G.move&&typeof G.x==='number'&&gp&&gp.axes.length>=4&&Math.abs(gp.axes[2])>.2)G.move(G.x+gp.axes[2]*S.cfg.vrStick*330*dt);
    const pv=VR.py.get(src);VR.py.set(src,m[13]);
    if(state==='play'&&(gid==='hop'||gid==='flap')&&pv!==undefined&&(m[13]-pv)/Math.max(dt,.001)>1.8&&VR.cool<=0){G.tap(W/2,H/2);VR.cool=.25;vrPulse(.6,30)}
  }
}
const inR=(x,y,a,b,w,h)=>x>=a&&x<=a+w&&y>=b&&y<=b+h;
function vrSelect(src){
  const g=VR.g.get(src);if(!g)return;const x=g[0],y=g[1];vrPulse(.4,25);
  if(state==='play'){if(inR(x,y,0,0,84,44)){if(score>0)settle();home();return}G.tap(x,y);return}
  if(performance.now()-overAt<500&&state==='over')return;
  if(state==='home'){
    GAMES.forEach((q,i)=>{if(inR(x,y,14+(i%3)*114,110+Math.floor(i/3)*106,104,96))start(q.id)});
    if(inR(x,y,110,480,140,44))VR.s.end();
  }else if(state==='over'){
    if(inR(x,y,60,290,240,54))start(gid);else if(inR(x,y,60,360,240,54))home();else if(inR(x,y,60,430,240,54))VR.s.end();
  }
}
function vrOverlay(){
  const sc2=cv.width/W,T0=T();ctx.setTransform(sc2,0,0,sc2,0,0);
  const pill=(l,x,y,w,h)=>{ctx.fillStyle='rgba(255,255,255,.16)';rr(x,y,w,h,12);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.stroke();txt(l,x+w/2,y+h/2+6,16,'#fff')};
  if(state==='play'){txt(score,W/2,58,48);txt('Best '+(S.best[gid]||0),W-44,26,13);pill('Menu',8,8,76,32)}
  else{
    ctx.fillStyle='rgba(0,0,0,.42)';ctx.fillRect(0,0,W,H);
    if(state==='home'){txt('Drift Arcade',W/2,64,34);txt('Aim and pull the trigger',W/2,92,14);
      GAMES.forEach((q,i)=>{const bx=14+(i%3)*114,by=110+Math.floor(i/3)*106;ctx.fillStyle='rgba(255,255,255,.14)';rr(bx,by,104,96,14);ctx.fill();txt(q.i,bx+52,by+46,30,'#fff');txt(q.n,bx+52,by+80,13,'#fff')});
      pill('Exit VR',110,480,140,44)}
    else if(state==='over'){txt('Game over',W/2,190,36);txt(score+' points',W/2,240,22);pill('Play again',60,290,240,54);pill('Menu',60,360,240,54);pill('Exit VR',60,430,240,54)}
  }
  if(S.cfg.cursor)VR.g.forEach(g=>{ctx.beginPath();ctx.arc(g[0],g[1],7,0,7);ctx.fillStyle=T0.ac;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke()});
}
function onXR(t,frame){
  const s=frame.session;s.requestAnimationFrame(onXR);
  const dt=Math.min(.05,(t-VR.last)/1000||0);VR.last=t;
  vrInput(frame,dt);tick(dt);vrOverlay();
  const gl=VR.gl,L=s.renderState.baseLayer,pose=frame.getViewerPose(VR.ref);if(!pose)return;
  ctx.fillStyle=bgStops()[1];const hx=ctx.fillStyle;
  gl.bindFramebuffer(gl.FRAMEBUFFER,L.framebuffer);
  gl.clearColor(parseInt(hx.slice(1,3),16)/510,parseInt(hx.slice(3,5),16)/510,parseInt(hx.slice(5,7),16)/510,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.bindTexture(gl.TEXTURE_2D,VR.tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  const P=PAN(),M=new Float32Array([P.w,0,0,0,0,P.h,0,0,0,0,1,0,P.x,P.y,P.z,1]),l=VR.loc;
  gl.useProgram(VR.prog);gl.bindBuffer(gl.ARRAY_BUFFER,VR.buf);
  gl.enableVertexAttribArray(l.p);gl.vertexAttribPointer(l.p,3,gl.FLOAT,false,20,0);gl.enableVertexAttribArray(l.u);gl.vertexAttribPointer(l.u,2,gl.FLOAT,false,20,12);
  gl.uniformMatrix4fv(l.M,false,M);
  for(const view of pose.views){const vp=L.getViewport(view);gl.viewport(vp.x,vp.y,vp.width,vp.height);gl.uniformMatrix4fv(l.P,false,view.projectionMatrix);gl.uniformMatrix4fv(l.V,false,view.transform.inverse.matrix);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
}
$('vrb').onclick=enterVR;
if(navigator.xr&&navigator.xr.isSessionSupported)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{VR.ok=ok;renderHome()}).catch(()=>{});
applyTheme();home();requestAnimationFrame(frame);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
